name: word_to_word
description: "Word to Word: aprende a hablar inglés con una sesión guiada cada día."
publish_to: 'none'
version: 1.0.9+11

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ">=14.2.0 <17.0.0"
  flutter_secure_storage: ">=9.2.0 <11.0.0"
  record: ">=5.1.0 <7.0.0"
  just_audio: ">=0.9.40 <0.11.0"
  audio_session: ">=0.1.21 <0.3.0"
  path_provider: ^2.1.4
  google_fonts: ">=6.2.0 <8.0.0"
  flutter_local_notifications: ^19.4.0
  timezone: ">=0.10.0 <0.11.0"
  flutter_timezone: ">=4.0.0 <6.0.0"
  in_app_update: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
